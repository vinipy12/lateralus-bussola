name: Weekly career radar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shortlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 radar.py --profile example
      - uses: actions/upload-artifact@v4
        with:
          name: career-shortlist
          path: out/example/shortlist.md
          retention-days: 30
